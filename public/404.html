<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShadeRoute</title>
  <script>
    // GitHub Pages SPA redirect — sends all 404s back to index.html
    // via a query-string approach so client-side routing works.
    const path = window.location.pathname;
    if (path !== '/' && path !== '/index.html') {
      window.location.replace(
        window.location.origin + '/?redirect=' + encodeURIComponent(path)
      );
    }
  </script>
</head>
<body></body>
</html>
